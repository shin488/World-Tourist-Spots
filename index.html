<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界の観光地ガイド</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Helvetica Neue',Arial,sans-serif; background:#fff; color:#222; overflow-x:hidden; }

/* ===== HERO SECTION ===== */
.hero {
  background: linear-gradient(135deg, rgba(255, 107, 53, 0.6) 0%, rgba(255, 200, 87, 0.6) 50%, rgba(100, 200, 255, 0.6) 100%), url('https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=1200&q=80');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color: #fff;
  text-align: center;
  padding: 10rem 2rem;
  position: relative;
  overflow: hidden;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: radial-gradient(circle at 20% 50%, rgba(255,255,255,.2) 0%, transparent 50%),
              radial-gradient(circle at 80% 80%, rgba(255,255,255,.1) 0%, transparent 50%);
  pointer-events: none;
}

.hero-content {
  position: relative;
  z-index: 2;
  max-width: 800px;
  margin: 0 auto;
  animation: slideUp .8s ease-out;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.plane-icon {
  font-size: 5rem;
  margin-bottom: 2rem;
  animation: planeFly 6s ease-in-out infinite;
  display: inline-block;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,.3));
}

@keyframes planeFly {
  0% {
    transform: translateX(-100px) translateY(0) rotate(-5deg);
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  50% {
    transform: translateX(100px) translateY(-30px) rotate(5deg);
  }
  90% {
    opacity: 1;
  }
  100% {
    transform: translateX(300px) translateY(0) rotate(-5deg);
    opacity: 0;
  }
}

.hero h1 {
  font-size: clamp(2.5rem, 7vw, 4rem);
  font-weight: 900;
  margin-bottom: 1rem;
  text-shadow: 4px 4px 12px rgba(0,0,0,.5);
  line-height: 1.2;
  letter-spacing: .02em;
}

.hero p {
  font-size: 1.3rem;
  margin-bottom: 2.5rem;
  color: rgba(255,255,255,.95);
  letter-spacing: .05em;
  text-shadow: 3px 3px 6px rgba(0,0,0,.4);
  line-height: 1.6;
}

.hero-buttons {
  display: flex;
  gap: 1rem;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}

.btn {
  padding: 1.2rem 3rem;
  font-size: 1.05rem;
  font-weight: 700;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  transition: all .3s;
  letter-spacing: .05em;
  box-shadow: 0 4px 15px rgba(0,0,0,.2);
}

.btn-primary {
  background: linear-gradient(135deg, #FF6B35 0%, #FFC857 100%);
  color: #fff;
}

.btn-primary:hover {
  transform: scale(1.1) translateY(-3px);
  box-shadow: 0 10px 30px rgba(255, 107, 53, .5);
}

.btn-secondary {
  background: rgba(255,255,255,.25);
  color: #fff;
  border: 2px solid rgba(255,255,255,.8);
  backdrop-filter: blur(10px);
}

.btn-secondary:hover {
  background: rgba(255,255,255,.35);
  transform: scale(1.05) translateY(-2px);
  border-color: #fff;
}

.hero-sub {
  font-size: .95rem;
  color: rgba(255,255,255,.85);
  text-shadow: 2px 2px 4px rgba(0,0,0,.3);
}

/* ===== STATS BAR ===== */
.stats {
  background: linear-gradient(90deg, #1a1a1a 0%, #2a2a2a 100%);
  color: #fff;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  box-shadow: 0 4px 20px rgba(0,0,0,.2);
}

.stat {
  padding: 1.5rem 3rem;
  text-align: center;
  border-right: 1px solid rgba(255,255,255,.1);
}

.stat:last-child { border-right: none; }

.stat-num { 
  font-size: 2rem; 
  font-weight: 800; 
  background: linear-gradient(135deg, #FF6B35, #FFC857);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.stat-label { font-size: .75rem; letter-spacing: .2em; color: rgba(255,255,255,.5); margin-top: .3rem; }

/* ===== SECTION ===== */
.section { padding: 4rem 2rem 5rem; }

.section-head { text-align: center; margin-bottom: 3rem; }

.section-head .label {
  font-size: .75rem; 
  letter-spacing: .3em;
  color: #FF6B35; 
  font-weight: 700; 
  margin-bottom: .8rem;
  text-transform: uppercase;
}

.section-head h2 { 
  font-size: clamp(1.8rem, 3vw, 2.8rem); 
  font-weight: 900;
  color: #1a1a1a;
  margin-bottom: .5rem;
}

.section-head p { color: #777; margin-top: .5rem; font-size: 1rem; }

/* ===== COUNTRY GRID ===== */
.country-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 2rem;
  max-width: 1300px;
  margin: 0 auto;
}

.country-card {
  display: block;
  text-decoration: none;
  color: inherit;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 8px 30px rgba(0,0,0,.12);
  transition: all .4s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  background: #fff;
}

.country-card:hover {
  transform: translateY(-16px) scale(1.02);
  box-shadow: 0 25px 60px rgba(255, 107, 53, .25);
}

.card-img-wrap { 
  overflow: hidden;
  position: relative;
  background: linear-gradient(135deg, #FF6B35, #FFC857);
}

.card-img {
  width: 100%; 
  height: 220px; 
  object-fit: cover;
  display: block; 
  transition: transform .5s;
}

.country-card:hover .card-img { 
  transform: scale(1.12) rotate(2deg); 
}

.card-body { 
  padding: 1.8rem; 
  background: #fff; 
}

.card-flag { 
  font-size: 2.5rem; 
  margin-bottom: .5rem; 
  display: block;
  animation: bounce 2s ease-in-out infinite;
}

.card-flag:nth-child(1) { animation-delay: 0s; }
.card-flag:nth-child(2) { animation-delay: .2s; }

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.card-name { 
  font-size: 1.4rem; 
  font-weight: 800; 
  margin-bottom: .3rem;
  color: #1a1a1a;
}

.card-sub { 
  font-size: .9rem; 
  color: #999; 
  margin-bottom: 1rem;
  line-height: 1.5;
}

.card-link {
  font-size: .85rem; 
  font-weight: 700;
  color: #FF6B35; 
  letter-spacing: .05em;
  transition: all .3s;
}

.country-card:hover .card-link {
  color: #FFC857;
  transform: translateX(5px);
}

/* ===== FEATURE STRIP ===== */
.feature-strip {
  background: linear-gradient(135deg, #FF6B35 0%, #FFC857 50%, #64C8FF 100%);
  background-size: 200% 200%;
  animation: gradientFlow 15s ease infinite;
  color: #fff; 
  padding: 5rem 2rem; 
  text-align: center;
  position: relative;
  overflow: hidden;
}

@keyframes gradientFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.feature-strip::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: radial-gradient(circle at 20% 50%, rgba(255,255,255,.1) 0%, transparent 50%);
  pointer-events: none;
}

.feature-strip h2 { 
  font-size: clamp(1.8rem,3vw,2.8rem); 
  font-weight: 900; 
  margin-bottom: 1rem;
  text-shadow: 2px 2px 4px rgba(0,0,0,.2);
  position: relative;
  z-index: 2;
}

.feature-strip p { 
  font-size: 1.1rem; 
  opacity: .95; 
  max-width: 700px; 
  margin: 0 auto;
  position: relative;
  z-index: 2;
  text-shadow: 1px 1px 3px rgba(0,0,0,.2);
}

/* ===== GALLERY SECTION ===== */
.gallery-section {
  text-align: center;
  padding: 4rem 2rem;
  background: linear-gradient(135deg, #f8f9fa 0%, #fff 100%);
}

.gallery-btn {
  display: inline-block;
  background: linear-gradient(135deg, #FF6B35, #FFC857);
  color: #fff;
  font-size: 1.05rem;
  font-weight: 700;
  padding: 1.1rem 3rem;
  border-radius: 50px;
  text-decoration: none;
  letter-spacing: .05em;
  transition: all .3s;
  box-shadow: 0 4px 15px rgba(255, 107, 53, .3);
}

.gallery-btn:hover {
  transform: scale(1.1) translateY(-3px);
  box-shadow: 0 12px 30px rgba(255, 107, 53, .4);
}

.gallery-sub {
  color: #999;
  font-size: .85rem;
  margin-top: 1rem;
  letter-spacing: .1em;
}
